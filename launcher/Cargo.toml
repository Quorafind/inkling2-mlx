[package]
name = "inkling2-launcher"
version = "0.1.0"
edition = "2021"
description = "Launcher and local OpenAI-compatible server (Chat Completions + Responses) for the Inkling 2 Mini MLX runtime"
license = "MIT"

[[bin]]
name = "inkling2"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
clap = { version = "4.6", features = ["derive", "env"] }
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
codegen-units = 1
